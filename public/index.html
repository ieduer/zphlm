<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf6ed">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="《紅樓夢脂評匯校本》八十回全本共讀：脂硯齋、畸笏叟諸家朱墨批語全輯，吳銘恩八十回匯校善本，支援朱墨評點切換、私人筆記與心動評點。">
  <title>紅樓夢脂評匯校本 · 曹雪芹 著 · 脂硯齋 評 · 吳銘恩 匯校</title>
  <link rel="icon" href="https://img.bdfz.net/20250503004.webp" type="image/webp">
  <link rel="apple-touch-icon" href="https://img.bdfz.net/20250503004.webp">
  <link rel="preload" href="/assets/cover.webp" as="image" type="image/webp">
  <script>
    /* 首屏前套用主題、字號、行距與閱讀模式，避免閃爍 */
    (function (d) {
      function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
      var theme = get("zphlm_theme");
      if (!theme) theme = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "paper";
      var fs = parseInt(get("zphlm_font") || "2", 10), lh = get("zphlm_leading") || "normal";
      var zp = get("zphlm_zp_mode") || "show";
      d.className = "theme-" + theme + " fs-" + (fs >= 0 && fs <= 4 ? fs : 2) +
        " lh-" + lh + (zp === "hide" ? " hide-zp-comments" : "") +
        (get("zphlm_read_mode") === "social" ? " read-social" : " read-quiet");
      var tc = { paper: "#faf6ed", sepia: "#ede3d2", dark: "#141210" }[theme];
      if (tc) {
        var el = document.querySelector('meta[name="theme-color"]');
        if (el) el.setAttribute("content", tc);
      }
    })(document.documentElement);
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap"></noscript>
  <link rel="stylesheet" href="/styles.css?v=2026100202">
  <script defer src="/content.js"></script>
  <script defer src="/read-storage.js?v=2026100202"></script>
  <script defer src="/app.js?v=2026100202"></script>
  <script>window.__BDFZ_WIDGET_CONFIG__={position:"right",insetBottom:84,insetSide:18,mobileInsetBottom:88,mobileInsetSide:14};</script>
  <script defer src="https://my.bdfz.net/site-auth.js" data-site-key="zphlm"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">跳到正文</a>
  <div class="read-progress" id="read-progress" aria-hidden="true"><span></span></div>

  <div class="site-frame" id="site-frame">
    <header class="topbar" aria-label="閱讀器頁首">
      <div class="topbar-left">
        <button class="icon-button menu-button" id="menu-button" type="button" aria-controls="chapter-drawer" aria-expanded="false" title="全書目錄">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
          <span class="visually-hidden">開啟目錄</span>
        </button>
        <button class="brand-button" id="brand-button" type="button" aria-label="返回《紅樓夢脂評匯校本》封面">
          <strong>紅樓夢</strong>
          <span>脂評匯校本 · 八十回全本</span>
        </button>
      </div>

      <div class="topbar-right">
        <button class="topbar-chip settings-chip" id="settings-btn" type="button" aria-controls="settings-panel" aria-expanded="false" title="閱讀設定：字號、行距、主題、脂批顯示">
          <span aria-hidden="true">Aa</span><span class="visually-hidden">閱讀設定</span>
        </button>
        <a class="topbar-chip shelf-link" href="https://coread.bdfz.net/" rel="noopener" title="返回共讀書架">書架</a>
        <a class="topbar-chip login-link" id="login-link" href="https://my.bdfz.net/?returnTo=https%3A%2F%2Fzphlm.bdfz.net%2F">登入</a>
      </div>

      <div class="settings-panel" id="settings-panel" role="dialog" aria-label="閱讀設定" hidden>
        <div class="set-row">
          <span class="set-label">字號</span>
          <div class="set-ctrl font-ctrl" aria-label="字號調整">
            <button type="button" class="set-btn" data-font="-1" aria-label="縮小字號">A-</button>
            <span class="set-val" id="font-val" aria-live="polite">標準</span>
            <button type="button" class="set-btn" data-font="1" aria-label="放大字號">A+</button>
          </div>
        </div>
        <div class="set-row">
          <span class="set-label">行距</span>
          <div class="set-ctrl seg-group" role="radiogroup" aria-label="行距">
            <button type="button" class="set-opt" data-leading="tight" role="radio">緊湊</button>
            <button type="button" class="set-opt" data-leading="normal" role="radio">適中</button>
            <button type="button" class="set-opt" data-leading="loose" role="radio">寬鬆</button>
          </div>
        </div>
        <div class="set-row">
          <span class="set-label">主題</span>
          <div class="set-ctrl seg-group" role="radiogroup" aria-label="顏色主題">
            <button type="button" class="set-opt swatch swatch-paper" data-theme="paper" role="radio">米白</button>
            <button type="button" class="set-opt swatch swatch-sepia" data-theme="sepia" role="radio">宣紙</button>
            <button type="button" class="set-opt swatch swatch-dark" data-theme="dark" role="radio">夜間</button>
          </div>
        </div>
        <div class="set-row">
          <span class="set-label">脂批</span>
          <div class="set-ctrl seg-group" role="radiogroup" aria-label="脂硯齋評語顯示">
            <button type="button" class="set-opt" data-zpmode="show" role="radio">顯示朱墨批</button>
            <button type="button" class="set-opt" data-zpmode="hide" role="radio">隱藏批語</button>
          </div>
        </div>
        <div class="set-row">
          <span class="set-label">模式</span>
          <div class="set-ctrl seg-group" role="radiogroup" aria-label="閱讀模式">
            <button type="button" class="set-opt" data-readmode="quiet" role="radio">安靜閱讀</button>
            <button type="button" class="set-opt" data-readmode="social" role="radio">共讀模式</button>
          </div>
        </div>
        <p class="set-hint" id="readmode-hint"></p>
      </div>
    </header>

    <main id="main-content" tabindex="-1">
      <section class="view is-active" id="read-view" aria-label="閱讀"></section>
      <section class="view" id="rankings-view" aria-label="心動榜" hidden></section>
      <section class="view" id="about-view" aria-label="關於善本" hidden></section>
    </main>
  </div>

  <div class="drawer-layer" id="drawer-layer" hidden>
    <button class="drawer-scrim" id="drawer-scrim" type="button" aria-label="關閉目錄"></button>
    <aside class="chapter-drawer" id="chapter-drawer" role="dialog" aria-modal="true" aria-label="全書目錄" tabindex="-1">
      <header class="drawer-header">
        <div>
          <span>CONTENTS</span>
          <h2>全書目錄</h2>
        </div>
        <button class="icon-button" id="drawer-close" type="button" aria-label="關閉目錄">×</button>
      </header>
      <label class="drawer-search" for="chapter-search">
        <span class="visually-hidden">搜尋章節標題</span>
        <input id="chapter-search" type="search" inputmode="search" autocomplete="off" placeholder="搜尋回目或附錄標題">
      </label>
      <p class="drawer-search-status" id="chapter-search-status" aria-live="polite"></p>
      <nav id="drawer-nav" aria-label="章節列表"></nav>
    </aside>
  </div>

  <nav class="bottom-nav" aria-label="主要功能">
    <button type="button" data-view="read" class="active" aria-current="page" aria-controls="read-view">
      <span class="nav-symbol" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      </span>
      <span>閱讀</span>
    </button>
    <button type="button" data-view="rankings" aria-controls="rankings-view">
      <span class="nav-symbol" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      </span>
      <span>心動榜</span>
    </button>
    <button type="button" data-view="about" aria-controls="about-view">
      <span class="nav-symbol" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
      </span>
      <span>善本</span>
    </button>
  </nav>

  <!-- Note Dialog -->
  <dialog class="reader-dialog note-dialog" id="note-dialog" aria-labelledby="note-dialog-title" aria-describedby="note-privacy">
    <form method="dialog" class="dialog-close-row">
      <button class="icon-button" type="submit" aria-label="關閉私人筆記">×</button>
    </form>
    <div class="dialog-heading">
      <span>PRIVATE NOTE</span>
      <h2 id="note-dialog-title">私人筆記</h2>
      <p id="note-privacy">只保存在這台裝置的瀏覽器裡，不會公開；可在「善本」頁匯出備份。</p>
    </div>
    <blockquote class="dialog-quote" id="note-segment-preview"></blockquote>
    <label class="field-label" for="note-text">筆記內容</label>
    <textarea id="note-text" rows="7" maxlength="12000" placeholder="記下你的紅樓考證、人物品評、讀後感悟或批註……"></textarea>
    <p class="field-status" id="note-status" aria-live="polite"></p>
    <div class="dialog-actions">
      <button class="secondary-button" id="note-delete" type="button">刪除</button>
      <button class="secondary-button" id="note-share" type="button">轉為公開評點</button>
      <button class="primary-button" id="note-save" type="button">保存筆記</button>
    </div>
  </dialog>

  <!-- Comments Dialog -->
  <dialog class="reader-dialog comments-dialog" id="comments-dialog" aria-labelledby="comments-dialog-title" aria-describedby="comments-visibility">
    <form method="dialog" class="dialog-close-row">
      <button class="icon-button" type="submit" aria-label="關閉共讀評點">×</button>
    </form>
    <div class="dialog-heading">
      <span>SHARED READING</span>
      <h2 id="comments-dialog-title">共讀評點</h2>
      <p id="comments-visibility">公開交流，所有讀者可見；登入後以你的名字署名。</p>
    </div>
    <blockquote class="dialog-quote" id="comment-segment-preview"></blockquote>
    <div class="comment-thread" id="comment-thread" aria-live="polite"></div>
    <form class="comment-composer" id="comment-form">
      <label class="field-label" for="comment-text">寫下評點</label>
      <textarea id="comment-text" rows="4" maxlength="2000" placeholder="寫下你對這段文字或脂批的品讀與見解……"></textarea>
      <div class="dialog-actions">
        <span class="field-status" id="comment-status" aria-live="polite"></span>
        <button class="primary-button" id="comment-submit" type="submit">發表評點</button>
      </div>
    </form>
  </dialog>

  <!-- Footnote popover -->
  <div class="fn-pop" id="fn-pop" role="note" hidden>
    <div class="fn-pop-body" id="fn-pop-body"></div>
    <button type="button" class="fn-pop-close" id="fn-pop-close" aria-label="關閉注釋">×</button>
  </div>

  <!-- Image viewer -->
  <dialog class="img-viewer" id="img-viewer" aria-label="圖片檢視">
    <form method="dialog"><button class="icon-button img-viewer-close" type="submit" aria-label="關閉圖片">×</button></form>
    <img id="img-viewer-img" alt="">
    <p id="img-viewer-cap"></p>
  </dialog>

  <input id="notes-import" type="file" accept="application/json,.json" hidden>
  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <button class="selbtn" id="selbtn" type="button" hidden>✍ 評點此句</button>
  <noscript><p class="noscript">需要啟用 JavaScript 才能閱讀《紅樓夢脂評匯校本》八十回章節、查看脂硯齋批語與參與共讀交流。</p></noscript>
</body>
</html>
